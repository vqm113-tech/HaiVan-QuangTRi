name: Fix seasonal bulletin Table 1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-table1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace seasonal Table 1 generator
        shell: python
        run: |
          from pathlib import Path

          path = Path("bulletin/bulletin_generator.py")
          text = path.read_text(encoding="utf-8")

          start = text.find("    station_name = data_dict.get('table1_station_name', 'Cồn Cỏ')")
          end_marker = "    # -------------------------------------------------------------------------\n    # 2. DỰ BÁO HẢI VĂN 3 THÁNG TỚI"
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("Không tìm thấy đúng khối Bảng 1; dừng để tránh ghi đè sai code.")

          replacement = '''    station_name = data_dict.get('table1_station_name', 'Cồn Cỏ')
    table1_labels = data_dict.get('table1_labels', [])
    table1_rows = data_dict.get('table1_rows', [])

    p_t1 = doc.add_paragraph()
    p_t1.paragraph_format.space_after = Pt(2)
    p_t1.alignment = WD_ALIGN_PARAGRAPH.CENTER
    p_t1.add_run(
        f"Bảng 1: Đặc trưng sóng, thủy triều tại trạm Hải văn {station_name}"
    ).bold = True

    # Bảng 1 đúng mẫu chuẩn: phần tiêu đề "Yếu tố" gộp 3 cột nhãn
    # (Yếu tố | Nhóm | Chỉ tiêu), sau đó là 3 cột kỳ quan trắc.
    # Thủy triều: gộp dọc 4 dòng; Nước lớn/Nước ròng: gộp từng 2 dòng;
    # Sóng: gộp dọc 3 dòng.
    labels = list(table1_labels[:3])
    while len(labels) < 3:
        labels.append("-")
    rows_data = list(table1_rows[:3])
    while len(rows_data) < 3:
        rows_data.append({})

    t1 = doc.add_table(rows=1, cols=6)
    t1.alignment = WD_TABLE_ALIGNMENT.CENTER
    t1.autofit = False
    set_table_borders(t1)

    # Header: Yếu tố chiếm 3 cột đầu, giống mẫu chuẩn.
    hdr = t1.rows[0].cells
    yeu_to = hdr[0].merge(hdr[2])
    format_cell(yeu_to, "Yếu tố", bold=True, size=13)
    for i, label in enumerate(labels):
        format_cell(hdr[3 + i], label, bold=True, size=13)

    rows_spec = [
        ("Thủy triều", "Nước lớn", "Hmax (cm)", "hmax"),
        ("Thủy triều", "Nước lớn", "Ngày xuất hiện", "hmax_day"),
        ("Thủy triều", "Nước ròng", "Hmin (cm)", "hmin"),
        ("Thủy triều", "Nước ròng", "Ngày xuất hiện", "hmin_day"),
        ("Sóng", "", "Độ cao sóng lớn nhất (m)", "wave_max"),
        ("Sóng", "", "Hướng sóng", "wave_dir"),
        ("Sóng", "", "Ngày xuất hiện", "wave_day"),
    ]

    group_starts = {}
    group_ends = {}
    subgroup_starts = {}
    subgroup_ends = {}

    for group_name, subgroup, indicator, key in rows_spec:
        row_cells = t1.add_row().cells
        row_idx = len(t1.rows) - 1
        group_starts.setdefault(group_name, row_idx)
        group_ends[group_name] = row_idx
        if subgroup:
            subgroup_starts.setdefault(subgroup, row_idx)
            subgroup_ends[subgroup] = row_idx

        format_cell(row_cells[1], subgroup, size=13)
        format_cell(row_cells[2], indicator, size=13)

        for period_idx, ext in enumerate(rows_data):
            value = ext.get(key) if ext else None
            if value is None or value == "":
                value = "-"
            elif key in ("hmax", "hmin"):
                try:
                    value = str(int(round(float(value))))
                except (TypeError, ValueError):
                    value = str(value)
            elif key in ("hmax_day", "hmin_day", "wave_day"):
                try:
                    value = str(int(value)) if float(value).is_integer() else str(value)
                except (TypeError, ValueError):
                    value = str(value)
            format_cell(row_cells[3 + period_idx], value, size=13)

    # Gộp dọc cột Yếu tố.
    merge_vertical(
        t1, 0, group_starts["Thủy triều"], group_ends["Thủy triều"],
        "Thủy triều", bold=False, size=13,
    )
    merge_vertical(
        t1, 0, group_starts["Sóng"], group_ends["Sóng"],
        "Sóng", bold=False, size=13,
    )

    # Gộp dọc cột Nhóm: Nước lớn 2 dòng, Nước ròng 2 dòng.
    merge_vertical(
        t1, 1, subgroup_starts["Nước lớn"], subgroup_ends["Nước lớn"],
        "Nước lớn", bold=False, size=13,
    )
    merge_vertical(
        t1, 1, subgroup_starts["Nước ròng"], subgroup_ends["Nước ròng"],
        "Nước ròng", bold=False, size=13,
    )

    # Độ rộng gần đúng mẫu A4: cột Yếu tố 1.45", Nhóm 1.60",
    # Chỉ tiêu 1.85", ba cột kỳ còn lại bằng nhau.
    widths = [1450, 1600, 1850, 1390, 1390, 1390]
    for col_idx, width in enumerate(widths):
        t1.columns[col_idx].width = Twips(width)
        for row in t1.rows:
            row.cells[col_idx].width = Twips(width)

    doc.add_paragraph().paragraph_format.space_after = Pt(6)

'''

          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding="utf-8")

      - name: Commit generated fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bulletin/bulletin_generator.py
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Fix seasonal bulletin Table 1 to match standard"
            git push
          fi
