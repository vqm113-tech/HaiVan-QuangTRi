name: Fix seasonal bulletin Table 1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-table1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Bảng 1
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("bulletin/bulletin_generator.py")
          text = path.read_text(encoding="utf-8")

          start_marker = "    station_name = data_dict.get('table1_station_name', 'Cồn Cỏ')\n"
          end_marker = "    doc.add_paragraph().paragraph_format.space_after = Pt(6)\n"
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)

          replacement = '''    station_name = data_dict.get('table1_station_name', 'Cồn Cỏ')
    table1_labels = data_dict.get('table1_labels', [])
    table1_rows = data_dict.get('table1_rows', [])

    # BẢNG 1 — cấu trúc đúng mẫu chuẩn:
    # 3 cột mô tả (Yếu tố / nhóm / chỉ tiêu) + 3 cột kỳ quan trắc.
    # Hmax/Hmin giữ nguyên đơn vị cm; sóng dùng m.
    p_t1 = doc.add_paragraph()
    p_t1.paragraph_format.space_after = Pt(2)
    p_t1.alignment = WD_ALIGN_PARAGRAPH.CENTER
    r_t1 = p_t1.add_run(
        f"Bảng 1: Đặc trưng sóng, thủy triều tại trạm Hải văn {station_name} "
        f"{data_dict.get('table1_period_text', '')}"
    )
    r_t1.bold = True
    r_t1.font.name = 'Times New Roman'
    r_t1.font.size = Pt(13)

    # 1 hàng tiêu đề + 7 hàng dữ liệu:
    # Thủy triều: Nước lớn (2), Nước ròng (2); Sóng (3).
    t1 = doc.add_table(rows=1, cols=6)
    t1.alignment = WD_TABLE_ALIGNMENT.CENTER
    t1.autofit = False
    set_table_borders(t1)

    # Độ rộng bám theo khổ A4 đứng, lề 3 cm trái / 2 cm phải.
    content_width = (
        doc.sections[-1].page_width
        - doc.sections[-1].left_margin
        - doc.sections[-1].right_margin
    )
    widths = [Cm(3.0), Cm(3.0), Cm(3.0), Cm(2.35), Cm(2.35), Cm(2.35)]
    scale = content_width / sum(w for w in widths)
    widths = [int(w * scale) for w in widths]
    for i, w in enumerate(widths):
        t1.columns[i].width = w

    # Tiêu đề "Yếu tố" gộp ngang 3 cột, đúng ảnh mẫu.
    hdr = t1.cell(0, 0).merge(t1.cell(0, 2))
    format_cell(hdr, 'Yếu tố', bold=True, size=13)
    for idx in range(3):
        t1.cell(0, idx).width = widths[idx]

    for i in range(3):
        label = table1_labels[i] if i < len(table1_labels) else '-'
        format_cell(t1.cell(0, 3 + i), label, bold=True, size=13)
        t1.cell(0, 3 + i).width = widths[3 + i]

    # Bổ sung 7 hàng dữ liệu.
    for _ in range(7):
        row = t1.add_row()
        for i, w in enumerate(widths):
            row.cells[i].width = w

    # Gộp nhóm dọc đúng mẫu.
    merge_vertical(t1, 0, 1, 4, 'Thủy triều', bold=False, size=13)
    merge_vertical(t1, 1, 1, 2, 'Nước lớn', bold=False, size=13)
    merge_vertical(t1, 1, 3, 4, 'Nước ròng', bold=False, size=13)
    merge_vertical(t1, 0, 5, 7, 'Sóng', bold=False, size=13)
    merge_vertical(t1, 1, 5, 7, 'Độ cao sóng lớn nhất (m)', bold=False, size=13)

    metric_labels = [
        'Hmax (cm)',
        'Ngày xuất hiện',
        'Hmin (cm)',
        'Ngày xuất hiện',
        '',
        'Hướng sóng',
        'Ngày xuất hiện',
    ]
    for r_i, label in enumerate(metric_labels, start=1):
        format_cell(t1.cell(r_i, 2), label, bold=False, size=13)

    # Ghi số liệu theo 3 kỳ. Hmax/Hmin là cm, không chia 100.
    data_keys = ['hmax', 'hmax_day', 'hmin', 'hmin_day', 'wave_max', 'wave_dir', 'wave_day']
    for r_i, key in enumerate(data_keys, start=1):
        for m_i in range(3):
            ext = table1_rows[m_i] if m_i < len(table1_rows) and table1_rows[m_i] else None
            val = ext.get(key) if ext else None
            if val is None:
                out = '-'
            elif key in ('hmax', 'hmin'):
                out = str(int(round(float(val))))
            else:
                out = str(val)
            format_cell(t1.cell(r_i, 3 + m_i), out, bold=False, size=13)

    # Dòng sóng: cột chỉ tiêu đã gộp ở cột 2; căn giữa và giữ đúng chiều cao
    # tự nhiên như mẫu.
    for row in t1.rows:
        row.height_rule = WD_ROW_HEIGHT_RULE.AT_LEAST

    doc.add_paragraph().paragraph_format.space_after = Pt(6)
'''

          # Chỉ thay đúng khối Bảng 1, tránh ảnh hưởng Bảng 2/phụ lục.
          text = text[:start] + replacement + text[end:]

          # Nếu tiêu đề_period_text chưa được tạo, bổ sung vào seasonal_data
          # ở bước tiếp theo không cần thiết: mặc định để chuỗi rỗng và giữ
          # tiêu đề hiện có. Tạo period text từ 3 nhãn nếu có để giống mẫu.
          if "table1_period_text" not in text:
              pass

          path.write_text(text, encoding="utf-8")

      - name: Commit patched file
        shell: bash
        run: |
          if git diff --quiet -- bulletin/bulletin_generator.py; then
            echo "No change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bulletin/bulletin_generator.py
          git commit -m "Fix Bảng 1 bản tin mùa theo mẫu chuẩn"
          git push
